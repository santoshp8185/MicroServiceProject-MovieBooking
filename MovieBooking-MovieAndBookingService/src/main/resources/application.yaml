server:
  port: 8082

spring:
  application:
    name: movie-booking-service

  datasource:
    url: jdbc:mysql://localhost:3306/movie_booking_movie
    username: ${DB_USERNAME:santosh}
    password: ${DB_PASSWORD:santosh}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
