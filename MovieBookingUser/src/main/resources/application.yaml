spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/movie_booking_user
    username: santosh
    password: santosh
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0

    export:
      zipkin:
        enabled: true

  zipkin:
    tracing:
      endpoint: http://localhost:9411/zipkin/api/v2/spans

  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
 
moviebooking:
  service:
    url: http://localhost:8082    